[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-cli-manager"
version = "0.9.2"
description = "AWS CLI Manager - orquestador de sesiones AWS, SSM, RDS, Kafka y port-forwarding"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "botocore>=1.34.0",
]

[project.scripts]
yappy = "yappy_devkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["yappy_devkit"]
