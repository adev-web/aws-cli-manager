[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yappy-cli-manager"
version = "1.0.0"
description = "Yappy CLI Manager - orquestador de sesiones AWS, SSM, RDS, Kafka y port-forwarding"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "botocore>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
yappy = "yappy_devkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["yappy_devkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
